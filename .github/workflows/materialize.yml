name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          curl -fsSL -o source.tar.gz "https://h.uguu.se/jFaystck.tar.gz"
          echo "ee423ab446293e98ec5c2a70713084674e4c1e23360d874c1b72514ce593702a  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Commit delivered files
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no file changes"
          else
            git commit -m "Materialize Emotional Piano Progressions [skip ci]"
            git push
          fi
      - name: Enable Pages from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "pages create $code"
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            {
              echo "pages create $code"
              cat /tmp/pages.json
            } > pages-result.txt
            git add pages-result.txt
            git commit -m "Record Pages API result [skip ci]"
            git push
            exit 1
          fi
