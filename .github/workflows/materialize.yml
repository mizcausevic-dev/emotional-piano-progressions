name: materialize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  duration-text:
    if: ${{ contains(github.event.head_commit.message, 'duration-text-once') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: State the catalog preview as 26.697 seconds
        run: |
          set -euo pipefail
          cat > /tmp/fix_index.py << 'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text()
          if "26.67" not in text and text.count("26.697") >= 3:
              raise SystemExit(0)
          if text.count("26.67") != 3:
              raise SystemExit("26.67 count %s" % text.count("26.67"))
          text = text.replace("26.67", "26.697")
          if "26.67" in text or text.count("26.697") != 3:
              raise SystemExit("replace failed")
          if "Variation B fills those bars with Am, F, and C." not in text:
              raise SystemExit("open thirds variation B sentence missing")
          if "Dm, a rest, one bar of G, then F4 on beat 4 of the next bar, A, a rest, C, Dm." not in text:
              raise SystemExit("falling alto sentence missing")
          if "\u2014" in text:
              raise SystemExit("emdash")
          if "preview, not a master" not in text:
              raise SystemExit("preview phrase missing")
          sentence = "The MP3 is the piano and the inner voice reference together. It is 26.697 seconds. preview, not a master."
          if sentence not in text:
              raise SystemExit("catalog sentence missing")
          path.write_text(text)
          PY
          python3 /tmp/fix_index.py
          git checkout HEAD~1 -- .github/workflows/materialize.yml
          if grep -q duration-text-once .github/workflows/materialize.yml; then
            echo "workflow was not restored"
            exit 1
          fi
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add index.html .github/workflows/materialize.yml
          git commit -m "State the catalog preview as 26.697 seconds [skip ci]"
          git push origin HEAD:main
          git fetch origin gh-pages
          git checkout --detach origin/gh-pages
          python3 /tmp/fix_index.py
          git add index.html
          git diff --cached --quiet && echo "gh-pages index already correct" && exit 0
          git commit -m "State the catalog preview as 26.697 seconds [skip ci]"
          git push origin HEAD:gh-pages
