name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack generator
        run: |
          curl -fsSL -o source.tar.gz "https://n.uguu.se/WbLxoXwa.tar.gz"
          echo "667ecb7662417b3c5062db5e3c5ab5c0ccb0b6620740fb045faa91cd9671c404  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Refresh score without new media
        run: python3 tools/refresh_score.py
      - name: Commit corrected score
        run: |
          set +e
          bash -x <<'EOS' > /tmp/git-step.txt 2>&1
          set -e
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git checkout -- source.tar.gz
          git add tools midi catalog score index.html media.html articles social checks
          git status --short
          git commit -m "Correct Open Thirds variation B and Falling Alto wording [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          score_commit=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git checkout --detach origin/gh-pages
          git checkout "$score_commit" -- \
            tools/compose.py \
            tools/article.py \
            tools/build_pack.py \
            tools/refresh_score.py \
            midi/s01-open-thirds/piano-b.mid \
            catalog/catalog-Cursor.json \
            score/canonical-score-Cursor.json \
            score/identity-Cursor.md \
            midi/validation-Cursor.json \
            index.html \
            media.html \
            articles/medium-draft-Cursor.md \
            articles/medium-paste-Cursor.txt \
            social/instagram-Cursor/captions-Cursor.md \
            social/x-Cursor/post-Cursor.txt \
            checks/artifact-checklist-Cursor.json
          git status --short
          git commit -m "Correct Open Thirds variation B and Falling Alto wording [skip ci]"
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
          EOS
          code=$?
          url=$(curl -fsSL -F "files[]=@/tmp/git-step.txt" "https://uguu.se/upload?output=text" || true)
          echo "log $url"
          echo "::error::$url"
          exit "$code"
